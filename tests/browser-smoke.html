    </style>

  <body>
    <main><h1>Tusi/Not-Tusi browser smoke</h1><pre id="results">Running…</pre></main>
    <script type="module">
      import { createModel, getPreset, listPresets } from "../src/core/index.js";
      import { createThreeRenderer } from "../src/renderers/three-renderer.js";
      import { createLineOscillator3D } from "../examples/pedagogy/pedagogy-models.js";

      const results = document.querySelector("#results");
      const pages = [
        { name: "launcher", url: "../index.html", presets: false, launcher: true },
        { name: "Tusi, Motion Control", url: "../examples/pedagogy/v0/?paused=1&time=7", presets: false, navLabel: "Motion", navAria: "Tusi, Motion Control", introductoryTusi: true, publicTitle: "Tusi, Motion Control", wrappedClock: true },
        { name: "Tusi, Phase Control", url: "../examples/pedagogy/tusi2/?paused=1&autoplay=1", presets: false, navLabel: "Phase", navAria: "Tusi, Phase Control", samplingTusi: true, publicTitle: "Tusi, Phase Control" },
        { name: "Not Tusi", url: "../examples/pedagogy/v0bis/?paused=1", presets: false, navLabel: "Not Tusi", navAria: "Not Tusi", introductoryNotTusi: true, publicTitle: "Not Tusi" },
        { name: "Parameter Sets", url: "../examples/pedagogy/v3/?paused=1", presets: false, navLabel: "Parameter Sets", navAria: "Parameter Sets", historicalV3: true, publicTitle: "Parameter Sets" },
        { name: "3D - Tusi", url: "../examples/pedagogy/tusi3d/?paused=1&time=1.25", presets: false, navLabel: "3D - Tusi", navAria: "3D - Tusi", tusi3d: true, publicTitle: "3D - Tusi" },
        { name: "3D - Not Tusi", url: "../examples/pedagogy/v4/?paused=1", presets: false, navLabel: "3D - Not Tusi", navAria: "3D - Not Tusi", historicalV4: true, publicTitle: "3D - Not Tusi" },
      ];

      const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

      async function waitUntil(check, timeout = 20000) {
        const started = performance.now();
        while (performance.now() - started < timeout) {
          const value = check();
          if (value) return value;
          await pause(50);
        }
        throw new Error(`Timed out after ${timeout} ms`);
      }

      function requireState(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function flushAnimationFrames(win, count = 1) {
        let completed = 0;
        let request = null;
        const frame = () => {
          completed += 1;
          request = completed < count ? win.requestAnimationFrame(frame) : null;
        };
        request = win.requestAnimationFrame(frame);
        try {
          // Keep a bounded timer pending: Chromium's virtual-time dump harness
          // can otherwise stop with an unresolved child-frame-only promise.
          await waitUntil(() => completed >= count, 10000);
        } catch (error) {
          throw new Error(`Only ${completed}/${count} startup animation frames completed: ${error.message}`);
        } finally {
          if (request !== null) win.cancelAnimationFrame(request);
        }
      }

      function testLauncherExperimentOrder(doc) {
        const cards = [...doc.querySelectorAll("#experiments .launcher > .demo-card")];
        const expectedRoutes = ["v0", "tusi2", "v0bis", "v3", "tusi3d", "v4"];
        const expectedLabels = [null, null, null, null, null, null];
        const expectedTitles = ["Tusi, Motion Control", "Tusi, Phase Control", "Not Tusi", "Parameter Sets", "3D - Tusi", "3D - Not Tusi"];
        const copy = doc.body.textContent;
        requireState(doc.title === "Tusi and Not-Tusi — Interactive Experiments" &&
          doc.querySelector("h1")?.textContent.trim() === "Tusi and Not-Tusi" &&
          doc.querySelector("#experiments-title")?.textContent.trim() === "Experiments",
          "launcher must use the simple Tusi and Not-Tusi title and Experiments heading");
        requireState(!doc.querySelector(".hero .eyebrow") &&
          /temporal phase\s+relationships/i.test(copy) &&
          !/teach(?:ing)?|lesson/i.test(copy),
          "launcher must present the explanation without an Abstract label or teaching language");
        requireState(!doc.querySelector(".site-header"),
          "launcher must not repeat its title in a redundant site header");
        requireState(cards.length === expectedRoutes.length,
          `launcher expected ${expectedRoutes.length} experiment cards, found ${cards.length}`);
        cards.forEach((card, index) => {
          const path = new URL(card.href).pathname.replace(/\/$/, "");
          requireState(path.endsWith(`/examples/pedagogy/${expectedRoutes[index]}`),
            `launcher experiment card ${index + 1} has unexpected route ${path}`);
          const eyebrow = card.querySelector(".eyebrow");
          if (expectedLabels[index] === null) {
            requireState(!eyebrow,
              `launcher ${expectedTitles[index]} card must not retain a numbered label`);
          } else {
            requireState(eyebrow?.textContent.trim() === expectedLabels[index],
              `launcher experiment card ${index + 1} must be labelled ${expectedLabels[index]}`);
          }
          requireState(card.querySelector("h3")?.textContent.trim() === expectedTitles[index],
            `launcher experiment card ${index + 1} must be titled ${expectedTitles[index]}`);
        });
      }

      function testLessonNavigation(doc, page) {
        const navigation = doc.querySelector(".lesson-nav");
        const links = [...doc.querySelectorAll(".lesson-nav a")];
        requireState(navigation?.getAttribute("aria-label") === "Experiment sequence",
          `${page.name}: navigation must be labelled as an experiment sequence`);
        requireState(links.map((link) => link.textContent.trim()).join(",") === "Motion,Phase,Not Tusi,Parameter Sets,3D - Tusi,3D - Not Tusi",
          `${page.name}: experiment navigation must place 3D - Tusi before 3D - Not Tusi`);
        const current = links.filter((link) => link.getAttribute("aria-current") === "page");
        requireState(current.length === 1 && current[0].textContent.trim() === page.navLabel,
          `${page.name}: lesson navigation has the wrong current page`);
        requireState(current[0].getAttribute("aria-label") === page.navAria,
          `${page.name}: current lesson navigation link has an incorrect accessible label`);
      }

      async function testIntroductoryLessonInteractions(iframe, doc, page) {
        const win = iframe.contentWindow;
        const setRange = (control, value) => {
          control.value = String(value);
          control.dispatchEvent(new win.Event("input", { bubbles: true }));
        };
        const count = doc.querySelector(page.introductoryTusi ? "#v0-count" : "#v0bis-count");
        const pointSize = doc.querySelector(page.introductoryTusi ? "#v0-point-size" : "#v0bis-point-size");
        const canvas = doc.querySelector(page.introductoryTusi ? "#v0-canvas" : "#v0bis-canvas");
        if (page.introductoryTusi) {
          requireState(count?.value === "24",
            "Tusi, Motion Control must start with Samples N = 24");
        }
        if (page.introductoryNotTusi) {
          requireState(count?.value === "24" && doc.querySelector("#v0bis-winding")?.value === "0",
            "Not Tusi must start with Samples N = 24 and Winding w = 0");
          const displayGroup = doc.querySelector('[data-panel="display"]');
          requireState(displayGroup?.contains(pointSize) &&
            displayGroup.contains(doc.querySelector("#v0bis-paths")) &&
            displayGroup.contains(doc.querySelector("#v0bis-connect")),
            "Not Tusi must group point size, riding circles, and moving-point connections under Display");
          requireState(!displayGroup.contains(count) &&
            !displayGroup.contains(doc.querySelector("#v0bis-winding")),
            "Not Tusi must keep Samples N and Winding w under Construction");
        }
        const decrease = doc.querySelector(`[data-step-for="${count?.id}"][data-step-direction="down"]`);
        const increase = doc.querySelector(`[data-step-for="${count?.id}"][data-step-direction="up"]`);
        requireState(count?.min === "1", `${page.name}: Samples N must have minimum 1`);
        requireState(decrease?.getAttribute("aria-label") === "Decrease Samples N",
          `${page.name}: Samples N needs an accessible decrement button`);
        requireState(increase?.getAttribute("aria-label") === "Increase Samples N",
          `${page.name}: Samples N needs an accessible increment button`);
        requireState(decrease.nextElementSibling === count && count.nextElementSibling === increase,
          `${page.name}: Samples N controls must be ordered minus, slider, plus`);
        const stepper = count.closest(".range-stepper");
        const stepperRow = count.closest(".stepper-row");
        const stepperLabel = stepperRow.querySelector(".stepper-label");
        const stepperBounds = stepper.getBoundingClientRect();
        const rowBounds = stepperRow.getBoundingClientRect();
        const labelBounds = stepperLabel.getBoundingClientRect();
        requireState(stepperBounds.width >= stepperRow.clientWidth * 0.54,
          `${page.name}: Samples N stepper must fill the available control-row width`);
        requireState(Math.abs(stepperBounds.right - rowBounds.right) <= 2,
          `${page.name}: Samples N stepper must reach the end of its row`);
        requireState(Math.abs((labelBounds.top + labelBounds.bottom) / 2 -
          (stepperBounds.top + stepperBounds.bottom) / 2) <= 4,
          `${page.name}: Samples N label and stepper must share one line`);
        setRange(count, 1);
        await pause(20);
        requireState(decrease.disabled, `${page.name}: decrement button must be disabled at N = 1`);
        increase.click();
        await pause(20);
        requireState(count.value === "2", `${page.name}: increment button did not advance Samples N`);
        decrease.click();
        await pause(20);
        requireState(count.value === "1", `${page.name}: decrement button did not reduce Samples N`);
        requireState(!doc.documentElement.dataset.demoError,
          `${page.name}: N = 1 produced ${doc.documentElement.dataset.demoError}`);
        requireState(pointSize?.min === "2" && pointSize.max === "12",
          `${page.name}: Point size control is missing or has the wrong range`);
        setRange(pointSize, 8);
        await waitUntil(() => canvas.dataset.pointSize === "8");
        requireState(doc.querySelector(`output[for="${pointSize.id}"]`)?.value === "8.0",
          `${page.name}: Point size output did not update`);
        requireState(!doc.querySelector(page.introductoryTusi ? "#v0-readout" : "#v0bis-readout"),
          `${page.name}: Sample 0 readout must be removed`);
        requireState(!doc.querySelector(page.introductoryTusi ? "#v0-status" : "#v0bis-status"),
          `${page.name}: canvas status text must be removed`);
        requireState(!doc.body.textContent.includes("Sample 0:"),
          `${page.name}: removed Sample 0 text is still visible`);

        const title = doc.querySelector("#lesson-title");
        const origin = doc.querySelector(".lesson-origin");
        requireState(origin?.previousElementSibling === title,
          `${page.name}: origin reference must appear immediately below the title`);
        for (const expected of ["Arthur G. Shapiro", "Alex Rose-Henig", "2nd Prize", "2013"]) {
          requireState(origin.textContent.includes(expected),
            `${page.name}: origin reference is missing ${expected}`);
        }
        if (page.introductoryTusi) {
          requireState(origin.textContent.includes("Nasir al-Din al-Tusi"),
            "Tusi origin must acknowledge Nasir al-Din al-Tusi");
        }
        requireState(parseFloat(win.getComputedStyle(origin).fontSize) <
          parseFloat(win.getComputedStyle(title).fontSize),
          `${page.name}: origin reference must remain visually secondary to the title`);

        if (page.introductoryTusi) {
          const motionInputs = [...doc.querySelectorAll('input[name="v0-motion"]')];
          const harmonicMotion = doc.querySelector('#v0-motion-tusi');
          const linearMotion = doc.querySelector('#v0-motion-linear');
          const equationPanel = doc.querySelector(".equation-panel");
          const velocityPlot = doc.querySelector("#tusi-velocity-plot");
          const velocityFigure = doc.querySelector(".tusi-velocity-figure");
          const motionSelector = doc.querySelector(".motion-profile-selector");
          const formulas = () => equationPanel.querySelector(".equation-formulas").textContent;
          const formulaElement = () => equationPanel.querySelector(".equation-formula");
          const equationExplanation = () => equationPanel.querySelector(".equation-explanation");
          const values = motionInputs.map((input) => input.value);
          requireState(velocityPlot?.getAttribute("aria-label")?.includes("Signed velocity") &&
            velocityPlot.getAttribute("aria-label").includes("versus time"),
            "Tusi signed-velocity plot is missing an accessible label");
          requireState(doc.querySelector("#tusi-velocity-caption")?.textContent ===
            "Signed velocity of the red point",
            "Tusi plot caption must identify signed velocity explicitly");
          requireState(velocityFigure.contains(motionSelector) &&
            !doc.querySelector(".control-panel").contains(motionSelector),
            "Tusi movement radios must be grouped with the velocity graph");
          requireState(motionInputs.every((input) => input.type === "radio") &&
            values.join(",") === "constant-speed,harmonic",
            `Tusi must expose Linear and Tusi radio laws; received ${values.join(",")}`);
          requireState(linearMotion.labels[0].textContent.includes("Linear") &&
            harmonicMotion.labels[0].textContent.includes("Tusi"),
            "Tusi movement radios must be labelled Linear and Tusi");
          requireState(!equationPanel.querySelector("[data-tooltip], .tooltip-mark, .has-tooltip") &&
            !velocityFigure.querySelector("[data-tooltip], .tooltip-mark, .has-tooltip"),
            "Tusi equation, velocity title, and motion radios must not retain tooltips");
          requireState(velocityPlot.width > 1 && velocityPlot.height > 1,
            "Tusi signed-velocity plot has no rendered canvas");
          requireState(
            velocityPlot.getBoundingClientRect().left > equationPanel.querySelector(".equation-copy").getBoundingClientRect().left,
            "Tusi velocity plot must appear to the right of the equation copy",
          );
          requireState(harmonicMotion.checked && !linearMotion.checked,
            "Tusi must start with harmonic motion");
          requireState(equationPanel.dataset.equationMode === "harmonic" && formulas().includes("R cos(ψᵢ)"),
            "Tusi must start with its harmonic equation");
          requireState(equationPanel.querySelectorAll(".equation-formula").length === 1,
            "Tusi must keep only the main equation visible");
          requireState(equationExplanation()?.previousElementSibling === formulaElement() &&
            equationExplanation().textContent.includes("θᵢ = πi/N") &&
            equationExplanation().textContent.includes("−Rω sin(ψᵢ)"),
            "Tusi must place its sampling, phase, and velocity explanation below the equation");
          requireState(!formulaElement().textContent.includes("L(ψ)"),
            "Tusi harmonic equation must not show the linear law");
          const compactButtons = doc.querySelector(".compact-animation-buttons");
          const clockButton = compactButtons?.querySelector('[data-clock="play"]');
          const resetButton = compactButtons?.querySelector('[data-clock="reset"]');
          requireState(resetButton?.textContent.trim() === "Reset",
            "Tusi animation reset button must be renamed Reset");
          requireState(clockButton.getBoundingClientRect().height < 35 &&
            resetButton.getBoundingClientRect().height < 35,
            "Tusi Pause/Play and Reset buttons must use the compact size");
          requireState(Number(velocityPlot.dataset.velocityMinimum) < 0 &&
            Number(velocityPlot.dataset.velocityMaximum) > 0,
            "Tusi signed-velocity plot must have a symmetric positive/negative range");
          const timeControl = doc.querySelector("#lesson-time");
          for (const [time, expected] of [
            [0, 0],
            [Math.PI / 2, -1],
            [Math.PI, 0],
            [3 * Math.PI / 2, 1],
          ]) {
            setRange(timeControl, time);
            await waitUntil(() => velocityPlot.dataset.velocityDefined === "true" &&
              Math.abs(Number(velocityPlot.dataset.normalizedVelocity) - expected) < 0.02);
          }
          requireState(velocityPlot.dataset.motionProfile === "harmonic",
            "Tusi velocity plot did not start with the harmonic law");
          linearMotion.checked = true;
          linearMotion.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => equationPanel.dataset.equationMode === "constant-speed");
          requireState(equationPanel.dataset.equationMode === "constant-speed",
            "Tusi did not select the constant-speed equation");
          requireState(formulaElement().textContent.includes("R L(ψᵢ)") &&
            !formulaElement().textContent.includes("arccos(cos ψ)"),
            "Tusi must show only the main linear position equation");
          requireState(equationExplanation().textContent.includes("arccos(cos ψ)") &&
            equationExplanation().textContent.includes("constant signed speed"),
            "Tusi linear explanation must appear below its main equation");
          setRange(timeControl, Math.PI / 2);
          await waitUntil(() => velocityPlot.dataset.motionProfile === "constant-speed" &&
            Math.abs(Number(velocityPlot.dataset.normalizedVelocity) + 2 / Math.PI) < 0.02);
          setRange(timeControl, 0);
          await waitUntil(() => velocityPlot.dataset.velocityDefined === "false");
          setRange(timeControl, 3 * Math.PI / 2);
          await waitUntil(() => velocityPlot.dataset.velocityDefined === "true" &&
            Math.abs(Number(velocityPlot.dataset.normalizedVelocity) - 2 / Math.PI) < 0.02);
          requireState(new URL(win.location.href).searchParams.get("motion") === "constant-speed",
            "Tusi constant-speed mode was not reflected in its URL");
          harmonicMotion.checked = true;
          harmonicMotion.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => equationPanel.dataset.equationMode === "harmonic");
          requireState(equationPanel.dataset.equationMode === "harmonic" && formulas().includes("R cos(ψᵢ)"),
            "Tusi did not restore the harmonic equation");
          requireState(velocityPlot.dataset.motionProfile === "harmonic" &&
            Math.abs(Number(velocityPlot.dataset.normalizedVelocity) - 1) < 0.02,
            "Tusi velocity plot did not restore the harmonic law");
          requireState(!formulaElement().textContent.includes("L(ψ)"),
            "Tusi retained the linear law after restoring harmonic motion");
          requireState(new URL(win.location.href).searchParams.get("motion") === "harmonic",
            "Tusi harmonic mode was not reflected in its URL");
          const displayGroup = doc.querySelector('[data-panel="display"]');
          const selectedPoint = doc.querySelector("#v0-highlight");
          const showSelected = doc.querySelector("#v0-selected");
          requireState(displayGroup?.contains(selectedPoint) &&
            displayGroup.contains(showSelected) &&
            displayGroup.contains(doc.querySelector("#v0-paths")) &&
            displayGroup.contains(doc.querySelector("#v0-connect")),
            "Tusi display section must group selected point, axes, and moving-point connection");
          requireState(!showSelected.checked && canvas.dataset.highlightedPointIndex === "-1",
            "Tusi must start with the selected dot hidden");
          setRange(count, 24);
          await waitUntil(() => selectedPoint.max === "23");
          setRange(selectedPoint, 5);
          await waitUntil(() => velocityPlot.dataset.selectedPointIndex === "5");
          linearMotion.checked = true;
          linearMotion.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => velocityPlot.dataset.motionProfile === "constant-speed");
          const shiftedReversals = velocityPlot.dataset.reversalTimes.split(",").map(Number);
          requireState(
            shiftedReversals.length === 2 &&
            Math.abs(shiftedReversals[0] - 5 * Math.PI / 24) < 1e-6 &&
            Math.abs(shiftedReversals[1] - (Math.PI + 5 * Math.PI / 24)) < 1e-6,
            `Tusi linear velocity plot ignored selected-point phase: ${velocityPlot.dataset.reversalTimes}`,
          );
          harmonicMotion.checked = true;
          harmonicMotion.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => velocityPlot.dataset.motionProfile === "harmonic");
          setRange(count, 3);
          await waitUntil(() => selectedPoint.max === "2" && selectedPoint.value === "2" &&
            velocityPlot.dataset.selectedPointIndex === "2");
          showSelected.checked = false;
          showSelected.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => canvas.dataset.highlightedPointIndex === "-1");
          showSelected.checked = true;
          showSelected.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => canvas.dataset.highlightedPointIndex === "2");
          const winding = doc.querySelector("#v0-winding");
          const windingDecrease = doc.querySelector('[data-step-for="v0-winding"][data-step-direction="down"]');
          const windingIncrease = doc.querySelector('[data-step-for="v0-winding"][data-step-direction="up"]');
          requireState(winding.min === "-99" && winding.max === "99" && winding.step === "2" &&
            windingDecrease.nextElementSibling === winding &&
            winding.nextElementSibling === windingIncrease,
            "Tusi winding must be a wide odd-only minus-slider-plus stepper");
          requireState(windingDecrease.getAttribute("aria-label") === "Decrease Odd winding w" &&
            windingIncrease.getAttribute("aria-label") === "Increase Odd winding w",
            "Tusi odd winding stepper needs accessible labels");
          setRange(winding, -99);
          await pause(20);
          requireState(windingDecrease.disabled,
            "Tusi winding decrement must be disabled at -99");
          windingIncrease.click();
          await pause(20);
          requireState(winding.value === "-97" &&
            doc.querySelector('output[for="v0-winding"]')?.value === "-97",
            "Tusi winding plus button must advance to the next odd value");
          setRange(winding, 99);
          await pause(20);
          requireState(windingIncrease.disabled,
            "Tusi winding increment must be disabled at 99");
          windingDecrease.click();
          await pause(20);
          requireState(winding.value === "97",
            "Tusi winding minus button must return to the previous odd value");
        } else {
          requireState(!doc.querySelector("#tusi-velocity-plot"),
            "Not Tusi must not display the signed line-velocity plot");
          requireState(!doc.body.textContent.includes("Uniform motion on fixed circles"),
            "Not Tusi must not retain the canvas title");
          const displayGroup = doc.querySelector('[data-panel="display"]');
          const selectedPoint = doc.querySelector("#v0bis-highlight");
          const showSelected = doc.querySelector("#v0bis-selected");
          setRange(count, 24);
          await waitUntil(() => selectedPoint?.max === "23");
          requireState(
            displayGroup?.contains(showSelected) &&
            displayGroup.contains(selectedPoint) &&
            !showSelected.checked &&
            canvas.dataset.highlightedPointIndex === "-1",
            "Not Tusi must expose coherent selected-dot controls and start with the dot hidden",
          );
          setRange(selectedPoint, 5);
          showSelected.checked = true;
          showSelected.dispatchEvent(new win.Event("change", { bubbles: true }));
          await waitUntil(() => canvas.dataset.highlightedPointIndex === "5");
          const winding = doc.querySelector("#v0bis-winding");
          const windingDecrease = doc.querySelector('[data-step-for="v0bis-winding"][data-step-direction="down"]');
          const windingIncrease = doc.querySelector('[data-step-for="v0bis-winding"][data-step-direction="up"]');
          requireState(winding?.step === "1",
            "Not Tusi winding must use integer steps");
          requireState(windingDecrease?.getAttribute("aria-label") === "Decrease Winding w" &&
            windingIncrease?.getAttribute("aria-label") === "Increase Winding w",
            "Not Tusi winding needs accessible minus and plus buttons");
          requireState(windingDecrease.nextElementSibling === winding &&
            winding.nextElementSibling === windingIncrease,
            "Not Tusi winding controls must be ordered minus, slider, plus");
          const windingStepper = winding.closest(".range-stepper");
          const windingRow = winding.closest(".stepper-row");
          const windingStepperBounds = windingStepper.getBoundingClientRect();
          const windingRowBounds = windingRow.getBoundingClientRect();
          const windingLabelBounds = windingRow.querySelector(".stepper-label").getBoundingClientRect();
          requireState(windingStepperBounds.width >= windingRow.clientWidth * 0.54,
            "Not Tusi winding stepper must fill the available control-row width");
          requireState(Math.abs(windingStepperBounds.right - windingRowBounds.right) <= 2 &&
            Math.abs((windingLabelBounds.top + windingLabelBounds.bottom) / 2 -
              (windingStepperBounds.top + windingStepperBounds.bottom) / 2) <= 4,
            "Not Tusi winding label and stepper must share one line");
          setRange(winding, -8);
          await pause(20);
          requireState(windingDecrease.disabled,
            "Not Tusi winding decrement must be disabled at -8");
          windingIncrease.click();
          await pause(20);
          requireState(winding.value === "-7" &&
            doc.querySelector('output[for="v0bis-winding"]')?.value === "-7",
            "Not Tusi winding plus button did not increment by one");
          setRange(winding, 8);
          await pause(20);
          requireState(windingIncrease.disabled,
            "Not Tusi winding increment must be disabled at 8");
          windingDecrease.click();
          await pause(20);
          requireState(winding.value === "7" &&
            doc.querySelector('output[for="v0bis-winding"]')?.value === "7",
            "Not Tusi winding minus button did not decrement by one");
        }
      }

      async function testHistoricalV3Interactions(iframe, doc) {
        const win = iframe.contentWindow;
        const change = (control) =>
          control.dispatchEvent(new win.Event("change", { bubbles: true }));
        const click = (id) => doc.querySelector(id).click();
        const parameterMode = doc.querySelector("#v3-mode-parameters");
        const pointMode = doc.querySelector("#v3-mode-points");
        const paths = doc.querySelector("#v3-paths");
        const displayGroup = doc.querySelector('[data-panel="display"]');
        const showSelected = doc.querySelector("#v3-selected");
        const highlightedPoint = doc.querySelector("#v3-highlight");
        const animationCanvas = doc.querySelector("#v3-animation");
        const selectorCanvas = doc.querySelector("#v3-selector");
        const selectorTitle = doc.querySelector(".v3-selector-title");
        const modeMessage = doc.querySelector("#v3-mode-message");
        const weights = doc.querySelector("#v3-weights");
        const tusiGeometry = doc.querySelector("#v3-geometry-tusi");
        const notTusiGeometry = doc.querySelector("#v3-geometry-not-tusi");
        const notTusiEditor = doc.querySelector('[data-v3-editor="not-tusi"]');

              Number(timeInput.value) <= Number(timeInput.max) &&
              Math.abs(Number(timeInput.value) - Number(clockRoot.dataset.clockTime)) <= 0.0000011,

              await flushAnimationFrames(iframe.contentWindow);

            }

            const expectedWrappedTime = 7 % (2 * Math.PI);
            const timeInput = doc.querySelector("#time");
            const timeOutput = doc.querySelector('output[for="time"]');
            requireState(
              Math.abs(Number(timeInput?.value) - expectedWrappedTime) <= 0.00251 &&
              Math.abs(Number(timeOutput?.value) - Number(timeInput?.value)) <= 0.0051 &&
              Number(timeOutput?.value) < 2 * Math.PI,

            );
          }
        }
        let presetCount = 0;
        if (page.presets) {
          const select = doc.querySelector("#preset-select");
          const values = [...select.options].map((option) => option.value).filter(Boolean);
          for (const value of values) {
            select.value = value;
            select.dispatchEvent(new Event("change", { bubbles: true }));
            await pause(page.name.includes("3-D") ? 90 : 25);
            if (doc.documentElement.dataset.demoError) throw new Error(`${value}: ${doc.documentElement.dataset.demoError}`);
            if (!doc.querySelector("#stage-status")?.textContent.includes("N =")) throw new Error(`${value}: status did not update`);
            const selectedUrl = new URL(iframe.contentWindow.location.href);
            if (selectedUrl.searchParams.get("preset") !== value) {
              throw new Error(`${value}: preset URL was not updated deterministically`);
            }
            presetCount += 1;
          }
        }
        if (page.historicalV3) {
          await testHistoricalV3Interactions(iframe, doc);
        }
        if (page.samplingTusi) {
          await testSamplingTusiInteractions(iframe, doc);
        }
        if (page.tusi3d) {
          await testTusi3DInteractions(iframe, doc);
        }
        if (page.historicalV4) {
          await testHistoricalV4Interactions(iframe, doc);
        }
        if (page.introductoryTusi || page.introductoryNotTusi) {
          await testIntroductoryLessonInteractions(iframe, doc, page);
        }
        if (consoleErrors.length) {
          throw new Error(`${page.name}: console errors: ${consoleErrors.join(" | ")}`);
        }
        iframe.remove();
        return presetCount;
      }

              harmonic.checked === (preset.motion === "harmonic") &&
              linear.checked === (preset.motion === "constant-speed") &&
              paths.labels[0].textContent.includes(preset.shape.destinationPhaseDegrees === 0
                ? "Show fixed diameters" : "Show fixed chords") &&
              `${root.dataset.clockTime}|${root.dataset.clockPlaying}` === clockBefore && camera() === cameraBefore,
              `${preset.label} must restore its exact geometry, motion, colors and display without changing the clock or camera`);
            return input;
          };

          for (const preset of expectedEpicyclePresets) {
            applyEpicyclePreset(preset);
            const presetPixels = pixels(canvas);
            requireState(presetPixels.some((value, index) => index % 4 !== 3 && value > 180) &&
              !doc.documentElement.dataset.demoError,
              `${preset.label} must produce a visible finite WebGL rendering`);
            const presetModel = createLineOscillator3D({
              pointCount: preset.count,
              radius: preset.radius,
              phase: { winding: preset.winding },
              geometryMode: "epicycle",
              epicycleShape: preset.shape,
              motionProfile: preset.motion,
            });
            requireState(presetModel.paths.length === preset.count && presetModel.paths.every((path) =>
              [...path.start, ...path.end, ...path.direction].every(Number.isFinite) &&
              Math.abs(Math.hypot(...path.start) - preset.radius) < 1e-10 &&
              Math.abs(Math.hypot(...path.end) - preset.radius) < 1e-10),
              `${preset.label} must create finite paths with both endpoints on its reference sphere`);
            for (const sampleTime of [0, 0.7, Math.PI, 2 * Math.PI]) {
              const points = presetModel.sample(sampleTime);
              requireState(points.length === preset.count && points.every((point) =>
                point.position.every(Number.isFinite) && Math.hypot(...point.position) <= preset.radius + 1e-10),
                `${preset.label} must remain finite and inside its sphere at t=${sampleTime}`);
            }
          }

          const manualPresetEdits = [
            [count, 568],
            [radius, 1.2],
            [carrier, 20],
            [turns, 75],
            [angularRadius, 28],
            [destinationPhase, -29],
            [winding, 1],
            [size, 10.5],
            [colors, 2],
          ];
          for (const [input, value] of manualPresetEdits) {
            applyEpicyclePreset(expectedEpicyclePresets[0]);
            setRange(input, value);
            requireState(root.dataset.activePreset === "" && !fourCornerPreset.checked &&
              epicyclePresetRadios.every((radio) => !radio.checked),
              `Manually editing ${input.id} must clear the E1 preset selection`);
          }
          for (const input of [linear, sphere, endpoints, paths, selected]) {
            applyEpicyclePreset(expectedEpicyclePresets[0]);
            choose(input);
            requireState(root.dataset.activePreset === "" && !fourCornerPreset.checked &&
              epicyclePresetRadios.every((radio) => !radio.checked),
              `Manually editing ${input.id} must clear the E1 preset selection`);
          }

          applyEpicyclePreset(expectedEpicyclePresets[0]);
          const presetStateBeforeRoundTrip = presetSnapshot();
          choose(modes.find((input) => input.value === "simple"));
          requireMode("simple");
          requireState(fourCornerPreset.checked && root.dataset.activePreset === "",
            "Switching away from Epicycle without editing it must retain the E1 preset selection");
          choose(modes.find((input) => input.value === "epicycle"));
          requireMode("epicycle");
          requireState(fourCornerPreset.checked && root.dataset.activePreset === expectedEpicyclePresets[0].id &&
            presetSnapshot() === presetStateBeforeRoundTrip,
            "Returning to Epicycle must retain the selected E1 preset and all of its values");

          // Also exercise the playing state synchronously: applying a preset
          // must not turn playback off or rewind the clock. No animation frame
          // can intervene within this event-dispatch call stack.
          setRange(carrier, 18);
          const playButton = doc.querySelector('[data-clock="play"]');
          playButton.click();
          const runningClock = root.dataset.clockTime;
          const runningCamera = camera();
          applyEpicyclePreset(expectedEpicyclePresets[0]);
          requireState(root.dataset.clockPlaying === "true" && root.dataset.clockTime === runningClock &&
            camera() === runningCamera,
            "Applying E1 during playback must preserve the running state, current time, and camera");
          playButton.click();
          requireState(root.dataset.clockPlaying === "false",
            "The Epicycle preset playback check must finish paused");
          requireState(!doc.documentElement.dataset.demoError,
            `Epicycle preset interactions produced ${doc.documentElement.dataset.demoError}`);
        } finally {
          reference?.dispose();
          referenceHost?.remove();
          iframe.remove();
        }
      }

      async function testTusi3DMotionUrlStartup() {
        const iframe = document.createElement("iframe");
        // Chromium throttles requestAnimationFrame in offscreen frames. This
        // check exercises real playback, so keep its temporary frame in view.
        iframe.style.left = "0";
        iframe.style.zIndex = "1";
        iframe.src = "../examples/pedagogy/tusi3d/?geometry=advanced&motion=constant-speed&paused=1&time=0.7";
        document.body.appendChild(iframe);
        await new Promise((resolve, reject) => {
          iframe.addEventListener("load", resolve, { once: true });
          iframe.addEventListener("error", () => reject(new Error("3D - Tusi linear-startup iframe load failed")), { once: true });
        });
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;
        await waitUntil(() => doc.documentElement.dataset.demoReady === "true" || doc.documentElement.dataset.demoError);
        requireState(!doc.documentElement.dataset.demoError,
          `3D - Tusi linear URL startup failed: ${doc.documentElement.dataset.demoError}`);
        const root = doc.querySelector("#pedagogy-root");
        const canvas = doc.querySelector("#tusi3d-host canvas");
        const linearMotion = doc.querySelector("#tusi3d-motion-linear");
        const harmonicMotion = doc.querySelector("#tusi3d-motion-tusi");
        const simpleGeometry = doc.querySelector("#tusi3d-mode-simple");
        const advancedGeometry = doc.querySelector("#tusi3d-mode-advanced");
        const lissajousGeometry = doc.querySelector("#tusi3d-mode-lissajous");
        const epicycleGeometry = doc.querySelector("#tusi3d-mode-epicycle");
        const playButton = doc.querySelector('[data-clock="play"]');
        requireState(
          linearMotion.checked && !harmonicMotion.checked && canvas.dataset.motionProfile === "constant-speed" &&
          advancedGeometry.checked && !simpleGeometry.checked && canvas.dataset.geometryMode === "advanced" &&
          doc.querySelector(".equation-panel").dataset.equationMode === "constant-speed" &&
          doc.querySelector(".equation-formula").textContent.includes("R L(ωt − Wθᵢ)") &&
          root.dataset.clockPlaying === "false" && Math.abs(Number(root.dataset.clockTime) - 0.7) < 1e-6 &&
          playButton.textContent.trim() === "Play" && root.dataset.activePreset === "tusi-3d-three-axis-weave",
          "3D - Tusi must honor an Advanced, paused Linear URL on its first rendered frame",
        );
        playButton.click();
        await waitUntil(() => Number(root.dataset.clockTime) > 0.7);
        const playingTime = root.dataset.clockTime;
        const playingCamera = canvas.dataset.cameraPosition;
        harmonicMotion.checked = true;
        harmonicMotion.dispatchEvent(new win.Event("change", { bubbles: true }));
        requireState(
          root.dataset.clockPlaying === "true" && root.dataset.clockTime === playingTime &&
          playButton.textContent.trim() === "Pause" && canvas.dataset.motionProfile === "harmonic" &&
          canvas.dataset.cameraPosition === playingCamera &&
          new URL(win.location.href).searchParams.get("motion") === "harmonic" &&
          new URL(win.location.href).searchParams.get("autoplay") === "1",
          "Switching 3D - Tusi motion during playback must preserve running time, camera, and autoplay URL state",
        );
        for (const geometry of [simpleGeometry, lissajousGeometry, epicycleGeometry, advancedGeometry]) {
          const geometryTime = root.dataset.clockTime;
          const geometryCamera = canvas.dataset.cameraPosition;
          geometry.checked = true;
          geometry.dispatchEvent(new win.Event("change", { bubbles: true }));
          requireState(root.dataset.clockPlaying === "true" && root.dataset.clockTime === geometryTime &&
            canvas.dataset.cameraPosition === geometryCamera && canvas.dataset.geometryMode === geometry.value &&
            canvas.dataset.motionProfile === "harmonic" &&
            new URL(win.location.href).searchParams.get("geometry") === geometry.value &&
            new URL(win.location.href).searchParams.get("motion") === "harmonic" &&
            new URL(win.location.href).searchParams.get("autoplay") === "1",
            "Switching Simple/Complex/Lissajous/Epicycle during playback must preserve the running clock, camera and motion URL");
        }
        playButton.click();
        requireState(root.dataset.clockPlaying === "false" && canvas.dataset.motionProfile === "harmonic",
          "Pausing after a motion change must preserve the chosen harmonic profile");
        iframe.remove();
      }

      async function testExperimentClockAutoplay() {
        const iframe = document.createElement("iframe");
        iframe.src = "../examples/pedagogy/v0/?autoplay=1";
        document.body.appendChild(iframe);
        await new Promise((resolve, reject) => {
          iframe.addEventListener("load", resolve, { once: true });
          iframe.addEventListener("error", () => reject(new Error("autoplay iframe load failed")), { once: true });
        });
        const doc = iframe.contentDocument;

        const clockRoot = doc.querySelector("#pedagogy-root");

          clockRoot.dataset.clockPlaying === "true" &&
          playButton.textContent.trim() === "Pause" &&

      async function testLauncherResponsiveGrid() {
        for (const [viewportWidth, expectedColumns] of [[1200, 3], [800, 2], [390, 1], [320, 1]]) {
          const iframe = document.createElement("iframe");
          iframe.style.width = `${viewportWidth}px`;
          iframe.style.height = "844px";
          iframe.src = "../index.html";
          document.body.appendChild(iframe);
          await new Promise((resolve, reject) => {
            iframe.addEventListener("load", resolve, { once: true });
            iframe.addEventListener("error", () => reject(new Error("launcher mobile iframe load failed")), { once: true });
          });
          const doc = iframe.contentDocument;
          const launcher = doc.querySelector("#experiments .launcher");
          const columnCount = iframe.contentWindow.getComputedStyle(launcher)
            .gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length;
          requireState(columnCount === expectedColumns,
            `launcher expected ${expectedColumns} columns at ${viewportWidth}px, found ${columnCount}`);
          const overflow = Math.max(
            doc.documentElement.scrollWidth - doc.documentElement.clientWidth,
            doc.body.scrollWidth - doc.body.clientWidth,

          requireState(overflow <= 1,
            `launcher has ${overflow}px of horizontal overflow at ${viewportWidth}px`);

            card.getBoundingClientRect().right <= doc.documentElement.clientWidth + 1),
            `launcher cards exceed the ${viewportWidth}px viewport`);
          iframe.remove();
        }
      }

      async function testExperimentPagesAtMobileWidth() {

            iframe.style.width = `${viewportWidth}px`;
            iframe.style.height = "844px";

            document.body.appendChild(iframe);

              iframe.addEventListener("error", () => reject(new Error(`${pageId} mobile iframe load failed`)), { once: true });

                Math.max(doc.documentElement.scrollWidth - doc.documentElement.clientWidth,

              epicyclePreset.checked = true;

              requireState(epicyclePreset.labels[0].textContent.includes("E6 Linear four-cross") &&
                doc.querySelector("#tusi3d-count").value === "520" &&
                Math.max(doc.documentElement.scrollWidth - doc.documentElement.clientWidth,
                  doc.body.scrollWidth - doc.body.clientWidth) <= 1,

              requireState(destinationPhase.labels[0].textContent.includes("Destination phase") &&
                doc.querySelector("#tusi3d-paths").labels[0].textContent.includes("Show fixed chords") &&
                Math.max(doc.documentElement.scrollWidth - doc.documentElement.clientWidth,
                  doc.body.scrollWidth - doc.body.clientWidth) <= 1,

      }

      function testFinitePresetSamples() {
        for (const preset of listPresets()) {
          const model = createModel(preset.config);
          for (const time of [0, 0.5, 2.25]) {
            const points = model.sample(time);
            if (points.length !== preset.config.pointCount) {
              throw new Error(`${preset.id}: sampled point count does not match its configuration`);
            }
            for (const point of points) {
              if (!point.position.every(Number.isFinite)) {
                throw new Error(`${preset.id}: non-finite coordinate at time ${time}`);
              }
            }
          }
        }
      }

      function testThreeRendererStability() {
        const preset = getPreset("tusi-3d-three-axis-weave");
        const model = createModel(preset.config);
        const host = document.createElement("div");
        host.style.cssText = "position:fixed;left:-10000px;top:0;width:480px;height:360px";
        document.body.appendChild(host);
        const view = createThreeRenderer(host, {
          model,
          time: 0,
          showPaths: true,
          palette: preset.config.visualization.palette,
        });
        const initialObjectCount = view.sceneObjectCount;
        const initialPositionAttribute = view.pointGeometry.getAttribute("position");
        if (!view.pointMaterial.map?.isCanvasTexture) {
          throw new Error("Three.js moving points must use a circular sprite texture");
        }
        for (let index = 0; index < 20; index += 1) {
          view.render(index / 10);
          view.setModel(model, index / 10);
          if (view.sceneObjectCount !== initialObjectCount) {
            throw new Error("Three.js scene-object count changed after repeated same-model updates");
          }
          if (view.pointGeometry.getAttribute("position") !== initialPositionAttribute) {
            throw new Error("Three.js point buffer was rebuilt without a point-count change");
          }
        }
        const explicitlyColoredModel = {
          ...model,
          sample(time) {
            return model.sample(time).map((point, index) => index === 0
              ? { ...point, color: "rgb(255,0,0)" }
              : point);
          },
        };
        view.setModel(explicitlyColoredModel, 0);
        const explicitColors = view.pointGeometry.getAttribute("color").array;
        if (!(explicitColors[0] > 0.99 && explicitColors[1] < 0.01 && explicitColors[2] < 0.01)) {
          throw new Error("Three.js renderer must honor an explicit preset point color");
        }
        view.dispose();
        host.remove();
      }

      try {
        let presetCount = 0;
        const lines = [];
        // A focused run is useful when inspecting one experiment in a live
        // browser whose GPU differs from the headless suite's software renderer.
        const requestedPage = new URL(location.href).searchParams.get("page");
        const selectedPages = requestedPage
          ? pages.filter((page) => page.url.includes(`/pedagogy/${requestedPage}/`))
          : pages;
        requireState(selectedPages.length > 0, `Unknown experiment: ${requestedPage}`);
        for (const page of selectedPages) {
          const count = await testPage(page);
          presetCount += count;
          lines.push(`PASS ${page.name}${count ? ` (${count} presets)` : ""}`);
        }
        if (!requestedPage) {
          await testExperimentClockAutoplay();
          lines.push("PASS experiment clock paused/autoplay startup semantics");
          await testTusi3DLissajousGeometry();
          lines.push("PASS 3D - Tusi Lissajous URL defaults, formula rendering, limits, 2D identity, 1000 balls and geometry memory");
          await testTusi3DEpicycleGeometry();
          lines.push("PASS 3D - Tusi Epicycle URL defaults, E1-E6 presets, destination-phase chords, formula rendering, limits, 1000 balls and geometry memory");
          await testTusi3DMotionUrlStartup();
          lines.push("PASS 3D - Tusi Complex Linear URL startup and four-mode switching during playback");
          await testLauncherResponsiveGrid();
          lines.push("PASS launcher 3/2/1-column responsive grid without horizontal overflow");
          await testExperimentPagesAtMobileWidth();
          lines.push("PASS experiment pages at 320px and 390px without horizontal overflow");
          testFinitePresetSamples();
          lines.push("PASS finite coordinates for every named preset");
          testThreeRendererStability();
          lines.push("PASS stable Three.js scene objects and point buffer");
        }
        lines.push(`BROWSER_SMOKE_PASS ${selectedPages.length} pages, ${presetCount} named presets`);
        results.textContent = lines.join("\n");
        document.documentElement.dataset.result = "pass";
      } catch (error) {
        results.textContent = `BROWSER_SMOKE_FAIL\n${error.stack ?? error.message}`;
        document.documentElement.dataset.result = "fail";
      }
