<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Representative manuscript states</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #17202a; background: #efefe9; font: 14px system-ui, sans-serif; }
      h1 { margin: 0 0 18px; font: 32px Georgia, serif; }
      main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #d3d4cf; border-radius: 12px; background: #fbfbf8; }
      figcaption { min-height: 58px; padding: 10px 12px; border-top: 1px solid #d3d4cf; }
      canvas, .three-host { display: block; width: 100%; height: 290px; }
    </style>
  </head>
  <body>
    <h1>Representative Tusi / Not-Tusi states</h1>
    <main id="gallery"></main>
    <script type="module">
      import { createModel, getPreset } from "../src/core/index.js";
      import { Canvas2DRenderer } from "../src/renderers/canvas-renderer.js";
      import { createThreeRenderer } from "../src/renderers/three-renderer.js";

      const cases = [
        ["tusi-2d-rotating-circle", 0.72],
        ["tusi-2d-winding-sweep", 0.72],
        ["not-tusi-2d-translating-ring", 1.15],
        ["not-tusi-2d-sweeping-blade", 1.15],
        ["tusi-3d-three-axis-weave", 0.85],
        ["not-tusi-3d-revolving-lobe", 0.85],
      ];
      const gallery = document.querySelector("#gallery");
      const views = [];
      for (const [id, time] of cases) {
        const preset = getPreset(id);
        const model = createModel(preset.config);
        const figure = document.createElement("figure");
        const host = document.createElement(model.dimension === 2 ? "canvas" : "div");
        if (model.dimension === 3) host.className = "three-host";
        const caption = document.createElement("figcaption");
        caption.innerHTML = `<strong>${preset.paperCallout}: ${preset.label}</strong><br>${preset.description}`;
        figure.append(host, caption);
        gallery.append(figure);
        if (model.dimension === 2) {
          const view = new Canvas2DRenderer(host, { showPaths: preset.config.visualization.showPaths }).setModel(model);
          view.render(time);
          views.push(view);
        } else {
          const view = createThreeRenderer(host, { model, time, showPaths: false, palette: preset.config.visualization.palette });
          // WebGL drawing buffers are not preserved after compositing by
          // default. Keep the deterministic state rendered so automated and
          // manual screenshots capture the same frame reliably.
          view.start(() => time);
          views.push(view);
        }
      }
      document.documentElement.dataset.demoReady = "true";
      window.__tusiReferenceViews = views;
    </script>
  </body>
</html>
